appId: dev.opssumner.ruggedspeechtest
productName: Rugged Speech Test
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
afterPack: build/afterPack.cjs

win:
  target:
    - target: nsis
      arch: [x64]
  # Code signing (docs/build-plan.md Phase 8): NOT YET CONFIGURED. Without a
  # certificate, Windows SmartScreen warns on every install, get one and
  # set win.certificateFile/certificatePassword (or CSC_LINK/CSC_KEY_PASSWORD
  # env vars) here before this ships to a real family or school. This has a
  # lead time; PRINCIPLES.md flagged starting it back in Phase 1.

# Per-user install, no admin rights (PRINCIPLES.md §3): schools and families
# frequently cannot elevate.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: ${productName}
  # Offers to keep or remove the child's data on uninstall (docs/build-plan.md Phase 8)
  #. NOT YET VERIFIED on real Windows; see the comment in the script itself.
  include: build/installer.nsh

# Windows 10 Pro is the only shipping target (PRINCIPLES.md §1). This mac target
# exists purely so the app can be built and run locally for development and
# testing, it is not a release channel. Unsigned: expect Gatekeeper to
# require right-click > Open on first launch.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  identity: null
