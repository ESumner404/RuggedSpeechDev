appId: dev.opssumner.ruggedspeechtest
productName: Rugged Speech Test
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
afterPack: build/afterPack.cjs

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName} Setup ${version}.${ext}
  # Code signing (docs/build-plan.md Phase 8): NOT YET CONFIGURED. Without a
  # certificate, Windows SmartScreen warns on every install, get one and
  # set win.certificateFile/certificatePassword (or CSC_LINK/CSC_KEY_PASSWORD
  # env vars) here before this ships to a real family or school. This has a
  # lead time; PRINCIPLES.md flagged starting it back in Phase 1.

# Per-user install, no admin rights (PRINCIPLES.md §3): schools and families
# frequently cannot elevate.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: ${productName}
  # Offers to keep or remove the child's data on uninstall (docs/build-plan.md Phase 8)
  #. NOT YET VERIFIED on real Windows; see the comment in the script itself.
  include: build/installer.nsh

# macOS is shipped alongside Windows (PRINCIPLES.md section 1): the same app,
# a disk image for Apple silicon and one for Intel Macs. It is not signed or
# notarised yet, so a Mac will not open it by double-click the first time; the
# guides say how to allow it. To sign and notarise, give the build a Developer
# ID certificate (CSC_LINK and CSC_KEY_PASSWORD) and, to notarise, set
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID and add
# `notarize: true` below. Without them electron-builder skips signing.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  artifactName: Rugged-Speech-Test-${version}-mac-${arch}.${ext}
  hardenedRuntime: false
dmg:
  title: ${productName}
  writeUpdateInfo: false
