name: Check

# Every change is checked on the two computers the app is shipped for, and
# the tests run against the packaged app, as PRINCIPLES.md section 8 asks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: End-to-end tests on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # A stuck test must not hold the build for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows Defender scans every new program and profile folder as it is used, which
      # makes the first starts of the freshly built app very slow on a build computer.
      - name: Keep Windows Defender off the test files
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:TEMP, $env:GITHUB_WORKSPACE
      - run: npm run pack
      # Stop after three failures: if the app will not start at all, there is no point running every test.
      - run: npx playwright test --max-failures=3
      - name: Keep what the failed tests saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ matrix.os }}
          path: test-results/**/error-context.md
          if-no-files-found: ignore
