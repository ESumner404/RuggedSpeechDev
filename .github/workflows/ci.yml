name: Check

# Every change is checked on the two computers the app is shipped for, and
# the tests run against the packaged app, as PRINCIPLES.md section 8 asks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: End-to-end tests on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # A stuck test must not hold the build for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack
      # TEMPORARY: show every step the first Windows test takes, to find where it stops.
      - name: Trace the first test on Windows
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: npx playwright test tests/e2e/access.spec.ts -g "high contrast" --max-failures=1 --timeout=45000
        env:
          DEBUG: pw:api
      # Stop after three failures: if the app will not start at all, there is no point running every test.
      - run: npx playwright test --max-failures=3
      - name: Keep what the failed tests saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ matrix.os }}
          path: test-results/**/error-context.md
          if-no-files-found: ignore
