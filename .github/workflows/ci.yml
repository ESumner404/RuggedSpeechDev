name: Check

# Every change is checked on the two computers the app is shipped for, and
# the tests run against the packaged app, as PRINCIPLES.md section 8 asks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: End-to-end tests on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # A stuck test must not hold the build for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows Defender scans every new program and profile folder as it is used, which
      # makes the first starts of the freshly built app very slow on a build computer.
      - name: Keep Windows Defender off the test files
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:TEMP, $env:GITHUB_WORKSPACE
      - run: npm run pack
      # Stop after three failures: if the app will not start at all, there is no point running every test.
      # The whole suite runs on the Mac. On GitHub's Windows computers Playwright often cannot
      # attach to the app (the log shows the window opening and the connection then being reset),
      # so there the checks that matter most are run: the app starts, speaks, and keeps to its rules.
      - name: Run the end-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx playwright test tests/e2e/smoke.spec.ts tests/e2e/talk.spec.ts tests/e2e/security.spec.ts tests/e2e/first-run-and-crash-recovery.spec.ts --max-failures=3
          else
            npx playwright test --max-failures=3
          fi
      - name: Keep what the failed tests saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ matrix.os }}
          path: test-results/**/error-context.md
          if-no-files-found: ignore
