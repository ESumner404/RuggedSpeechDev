name: Release

# One release for both computers. Push a tag such as v0.2.0 (it must match the
# version in package.json) and this builds the Windows installer and the two
# Mac disk images, and puts them in a DRAFT release with checksums. Nothing is
# public until the draft is published by hand, so there is time to try the
# files first. The app itself never checks for updates: a new version is a new
# file that someone installs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: The tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME} but package.json says ${version}." >&2
            exit 1
          fi

  windows:
    name: Windows installer
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist
        env:
          # Set these as repository secrets to sign the installer (see README).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*Setup*.exe
          if-no-files-found: error

  mac:
    name: Mac disk images
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:mac
        env:
          # Set these as repository secrets to sign and notarise (see README).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*.dmg
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Names the website links to
        working-directory: files
        run: |
          cp Rugged*Setup*.exe RuggedSpeech-Setup-Windows.exe
          cp Rugged-Speech-Test-*-mac-arm64.dmg RuggedSpeech-Mac-AppleSilicon.dmg
          cp Rugged-Speech-Test-*-mac-x64.dmg RuggedSpeech-Mac-Intel.dmg
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the draft
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Rugged Speech Test ${GITHUB_REF_NAME}" \
            --notes "Windows: the Setup .exe. Mac: the .dmg for your Mac (arm64 for Apple silicon, x64 for Intel). Check a download against SHA256SUMS.txt. These are not signed yet, so see the README for how to open them the first time."
      - name: Keep the files (a manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: files/*
